<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cascade</title>
    <link rel="icon" type="image/svg+xml" href="./images/icon.svg" />
    <link rel="stylesheet" href="./popup.page.css" />
  </head>
  <body class="app-layout">
    <div role="tablist">
      <button id="select-tab-trigger" role="tab" aria-selected="true" aria-controls="select-container" tabindex="0">
        Select
      </button>
      <button id="script-tab-trigger" role="tab" aria-selected="false" aria-controls="monaco-container" tabindex="-1">
        Script
      </button>
      <button id="config-tab-trigger" role="tab" aria-selected="false" aria-controls="config-container" tabindex="-1">
        Config
      </button>
    </div>
    <div id="resize-target" style="height: 400px">
      <div id="select-container" role="tabpanel" aria-labelledby="select-tab-trigger">
        <div>
          <button id="select-positive">Positive</button>
          <button id="select-negative">Negative</button>
          <button id="stop-selection">Stop</button>
          <button id="generate-code">Generate</button>
        </div>
        <div id="selected-elements"></div>
        <textarea id="instruction" placeholder="Instruction"></textarea>
      </div>
      <div id="monaco-container" role="tabpanel" aria-labelledby="script-tab-trigger" hidden></div>
      <div id="config-container" role="tabpanel" aria-labelledby="config-tab-trigger" hidden>
        <form id="config-form">
          <label for="openai-api-key">OpenAI API Key</label>
          <input id="openai-api-key" name="openai-api-key" type="password" />
          <button type="submit">Update</button>
        </form>
      </div>
    </div>
    <div id="resize-handle"></div>
    <div id="json-editor"></div>
    <script type="module" src="./popup.page.js"></script>
  </body>
</html>
